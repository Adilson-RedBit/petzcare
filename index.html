<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1D4ED8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PetzCare" />

    <!-- Ícones -->
    <link rel="shortcut icon" href="/logo.png" type="image/png" />
    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Open Graph (WhatsApp, Facebook, etc.) -->
    <meta property="og:title" content="PetzCare — Agende o banho e tosa do seu pet" />
    <meta property="og:description" content="Agendamento online fácil e rápido. Banho, tosa e muito carinho para o seu pet!" />
    <meta property="og:image" content="https://petzcare.org/logo.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:url" content="https://petzcare.org/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PetzCare" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter / WhatsApp fallback -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PetzCare — Agende o banho e tosa do seu pet" />
    <meta name="twitter:description" content="Agendamento online fácil e rápido. Banho, tosa e muito carinho para o seu pet!" />
    <meta name="twitter:image" content="https://petzcare.org/logo.png" />

    <title>PetzCare</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/react-app/main.tsx"></script>
  </body>
</html>
