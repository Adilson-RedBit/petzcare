<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient (Azul para Roxo) -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)"/>
  
  <!-- Paw Print Icon (Lucide PawPrint style) -->
  <g transform="translate(256, 256) scale(1.8)">
    <!-- Main Pad -->
    <ellipse cx="0" cy="25" rx="40" ry="48" fill="white" opacity="0.95"/>
    
    <!-- Top Left Toe -->
    <circle cx="-42" cy="-28" r="22" fill="white" opacity="0.95"/>
    
    <!-- Top Middle Left Toe -->
    <circle cx="-15" cy="-42" r="22" fill="white" opacity="0.95"/>
    
    <!-- Top Middle Right Toe -->
    <circle cx="15" cy="-42" r="22" fill="white" opacity="0.95"/>
    
    <!-- Top Right Toe -->
    <circle cx="42" cy="-28" r="22" fill="white" opacity="0.95"/>
  </g>
</svg>
